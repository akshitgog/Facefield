# 03-login.yaml
# Flow: Authentication with Registered User Credentials
# Source of truth: Source_Code/client/screens/auth/LoginScreen.tsx & RootNavigator.tsx
appId: com.helloworld
env:
  TEST_EMAIL: "qa.engineer@facefield.internal"
  TEST_PASSWORD: "password123"
---
- launchApp:
    clearState: false

# If already on Dashboard, no need to log in again
- runFlow:
    when:
      visible: "Mark Attendance|Today's Status"
    commands:
      - assertVisible: "Mark Attendance"

# If on Login screen, perform login
- runFlow:
    when:
      visible: "Facefield|Login"
    commands:
      # If email field shows placeholder, type email
      - runFlow:
          when:
            visible: "you@example.com"
          commands:
            - tapOn: "you@example.com"
            - inputText: ${TEST_EMAIL}
            - hideKeyboard

      - tapOn: "Enter password"
      - inputText: ${TEST_PASSWORD}
      - hideKeyboard

      # Tap Login button (exact text from LoginScreen.tsx line 116)
      - tapOn: "Login"

# Verify Dashboard is reached
- extendedWaitUntil:
    visible: "Mark Attendance|Today's Status"
    timeout: 10000
