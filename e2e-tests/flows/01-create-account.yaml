# 01-create-account.yaml
# Flow: Discovered Account Creation (Signup Step 1 & Step 2)
# Source of truth: Source_Code/client/screens/auth/SignupScreen.tsx
appId: com.helloworld
env:
  TEST_NAME: "QA Automation User"
  TEST_EMAIL: "qa.engineer@facefield.internal"
  TEST_PHONE: "9876543210"
  TEST_PASSWORD: "password123"
  TEST_ADDRESS: "Automated QA Test Facility, Sector 4"
  TEST_WORKPLACE: "FaceField Engineering Lab"
  TEST_AGE: "28"
  TEST_IDCARD: "QA-8821"
  TEST_SECURITY: "Mr. Turing"
---
- launchApp:
    clearState: false

# Verify on Login screen with Facefield branding
- extendedWaitUntil:
    visible: "Facefield|Create Account"
    timeout: 10000

# Tap Create Account button (exact text from LoginScreen.tsx)
- tapOn: "Create Account"

# Verify on Signup Screen Step 1
- extendedWaitUntil:
    visible: "Step 1 of 2"
    timeout: 5000

# Step 1: Basic Info
- tapOn: "John Doe"
- inputText: ${TEST_NAME}
- hideKeyboard

- tapOn: "you@example.com"
- inputText: ${TEST_EMAIL}
- hideKeyboard

- tapOn: "e.g. 9876543210"
- inputText: ${TEST_PHONE}
- hideKeyboard

- tapOn: "Min 6 characters"
- inputText: ${TEST_PASSWORD}
- hideKeyboard

- tapOn: "Re-enter password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard

# Submit Step 1
- tapOn: "Continue →"

# Verify Step 2 of 2
- extendedWaitUntil:
    visible: "Step 2 of 2"
    timeout: 5000

# Step 2: Extended Details
- tapOn: "Street, City, State"
- inputText: ${TEST_ADDRESS}
- hideKeyboard

- tapOn: "e.g. Ministry of Roads"
- inputText: ${TEST_WORKPLACE}
- hideKeyboard

- tapOn: "e.g. 30"
- inputText: ${TEST_AGE}
- hideKeyboard

- tapOn: "e.g. MOR-001"
- inputText: ${TEST_IDCARD}
- hideKeyboard

- tapOn: "Favorite teacher or food?"
- inputText: ${TEST_SECURITY}
- hideKeyboard

# Submit Step 2 -> Triggers navigation to FaceRegistrationScreen
- tapOn: "Register & Set Up Face →"

# Assert reached FaceRegistrationScreen
- extendedWaitUntil:
    visible: "Register Your Face"
    timeout: 8000
