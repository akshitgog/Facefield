# 07-returning-user-login.yaml
# Flow: Returning user with persisted registeredUsers logs in
# Source of truth: LoginScreen.tsx checks registeredUsers[email] from Zustand/AsyncStorage
appId: com.helloworld
env:
  TEST_EMAIL: "qa.engineer@facefield.internal"
  TEST_PASSWORD: "password123"
---
- launchApp:
    clearState: false

# Should be on Login screen (after logout or fresh restart)
- extendedWaitUntil:
    visible: "Facefield|Login|Create Account"
    timeout: 10000

- tapOn: "you@example.com"
- inputText: ${TEST_EMAIL}
- hideKeyboard

- tapOn: "Enter password"
- inputText: ${TEST_PASSWORD}
- hideKeyboard

- tapOn: "Login"

# Should go directly to Dashboard (faceRegistered=true in registeredUsers)
- extendedWaitUntil:
    visible: "Mark Attendance|Today's Status"
    timeout: 10000
