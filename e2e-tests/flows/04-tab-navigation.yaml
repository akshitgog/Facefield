# 04-tab-navigation.yaml
# Flow: Tab Navigation Cycle (Home -> History -> Profile -> Home)
# Source of truth: Source_Code/client/navigation/AppTabs.tsx
appId: com.helloworld
---
# Verify starting on Home / Dashboard
- extendedWaitUntil:
    visible: "Mark Attendance|Today's Status"
    timeout: 10000

# 1. Navigate to History Tab
- tapOn: "History"
- extendedWaitUntil:
    visible: "History|Attendance History|No records|Entry Time"
    timeout: 5000

# 2. Navigate to Profile Tab
- tapOn: "Profile"
- extendedWaitUntil:
    visible: "Personal Details|Registered Face|Logout"
    timeout: 5000

# 3. Navigate back to Home Tab
- tapOn: "Home"
- extendedWaitUntil:
    visible: "Mark Attendance|Today's Status"
    timeout: 5000
