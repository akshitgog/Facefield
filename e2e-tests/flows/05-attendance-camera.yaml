# 05-attendance-camera.yaml
# Flow: Attendance Camera Lifecycle & ML Frame Processor Activation
# Source of truth: client/screens/attendance/AttendanceVerificationScreen.tsx
appId: com.helloworld
---
# Verify starting on Dashboard
- extendedWaitUntil:
    visible: "Mark Attendance"
    timeout: 10000

# 1. Mount Camera via "Mark Attendance" CTA
- tapOn: "Mark Attendance"

# 2. Wait for Attendance Screen & Camera initialization
- extendedWaitUntil:
    visible: "Ready to Scan|Start Scanning"
    timeout: 8000

# 3. [AUTOMATED STEP]: Engage Native ML Frame Processor
- tapOn: "Start Scanning"

# 4. [BIOMETRIC STREAMING DWELL]:
# The native MediaPipe + FaceNet C++ / Kotlin pipeline processes camera frames in real time.
# Require a completed analysis result before leaving the camera.
- extendedWaitUntil:
    visible:
      id: "camera-analysis-ready"
    timeout: 8000
- assertNotVisible:
    id: "camera-error"

# 5. Handle either Success transition or manual Cancel
- runFlow:
    when:
      visible: "Back to Dashboard"
    commands:
      - tapOn: "Back to Dashboard"

- runFlow:
    when:
      visible: "✕"
    commands:
      - tapOn: "✕"

# 6. Verify safely returned to Dashboard without process crash
- extendedWaitUntil:
    visible: "Mark Attendance|Today's Status"
    timeout: 8000
