# wrong-password-attempt.yaml
# Flow: Attempt login with incorrect password and verify rejection
# Source of truth: LoginScreen.tsx line 53
appId: com.helloworld
env:
  TEST_EMAIL: "qa.engineer@facefield.internal"
  WRONG_PASSWORD: "wrong_password_999"
---
# Ensure on Login screen
- extendedWaitUntil:
    visible: "Facefield|Login"
    timeout: 8000

# Enter email if empty
- runFlow:
    when:
      visible: "you@example.com"
    commands:
      - tapOn: "you@example.com"
      - inputText: ${TEST_EMAIL}
      - hideKeyboard

# Enter incorrect password
- tapOn: "Enter password"
- inputText: ${WRONG_PASSWORD}
- hideKeyboard

# Tap Login button
- tapOn: "Login"

# Verify rejection alert appears
- extendedWaitUntil:
    visible: "Login failed|Incorrect password"
    timeout: 6000

# Dismiss Alert
- tapOn: "OK"

# Verify still on Login screen (unauthenticated)
- extendedWaitUntil:
    visible: "Facefield|Login|Create Account"
    timeout: 5000
