# stress-camera-lifecycle.yaml
# Reliability: Repeated camera mount/unmount via Attendance screen
# Exercises CameraX + MediaPipe native pipeline teardown
# Does NOT require a human face — just open/activate/close cycles
appId: com.helloworld
---
# Assumes already logged in on Dashboard
- extendedWaitUntil:
    visible: "Mark Attendance"
    timeout: 10000

# Repeat camera lifecycle: enter -> activate frame processor -> tear down
- repeat:
    times: ${STRESS_CYCLES}
    commands:
      # 1. Enter Attendance Camera
      - tapOn: "Mark Attendance"
      - extendedWaitUntil:
          visible: "Ready to Scan|Start Scanning"
          timeout: 6000

      # 2. Activate ML Frame Processor
      - tapOn: "Start Scanning"

      # 3. A live process is insufficient: require a real analysis result every cycle.
      - extendedWaitUntil:
          visible:
            id: "camera-analysis-ready"
          timeout: 10000
      - assertNotVisible:
          id: "camera-error"
      # Dwell with active frame processing (CameraX + MediaPipe)
      - extendedWaitUntil:
          visible: "NEVER_MATCHES_SENTINEL"
          timeout: ${CAMERA_DWELL_MS}
          optional: true

      # 4. Tear down camera mid-processing via hardware back
      - pressKey: back

      # 5. Verify back on Dashboard without crash
      - extendedWaitUntil:
          visible: "Mark Attendance|Today's Status"
          timeout: 6000
